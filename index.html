<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4ede1">
<title>Ashish &amp; Easter — Wedding Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&amp;family=Great+Vibes&amp;family=Noto+Serif+Telugu:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage" class="stage">

  <section class="scene" id="scene-1" data-scene="1" aria-label="Invitation envelope"></section>
  <section class="scene" id="scene-2" data-scene="2" aria-label="Names"></section>
  <section class="scene" id="scene-3" data-scene="3" aria-label="Photo story"></section>
  <section class="scene" id="scene-4" data-scene="4" aria-label="Blessing"></section>
  <section class="scene" id="scene-5" data-scene="5" aria-label="Ceremony and reception"></section>
  <section class="scene" id="scene-6" data-scene="6" aria-label="Closing"></section>

  <button id="sound-btn" class="sound-btn" type="button" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path class="ic-body" d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path>
      <path class="ic-wave" d="M15.4 9.2a4 4 0 0 1 0 5.6M17.7 7a7 7 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path>
      <path class="ic-off" d="M15.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path>
    </svg>
  </button>

  <button id="next-btn" class="next-btn" type="button" hidden>
    <span id="next-btn-label" class="next-btn-label"></span>
    <svg viewBox="0 0 18 10" width="18" height="10" aria-hidden="true">
      <path d="M1 1l8 8 8-8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
  </button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script src="js/scene1.js"></script>
<script src="js/scene2.js"></script>
<script src="js/scene3.js"></script>
<script src="js/scene4.js"></script>
<script src="js/scene5.js"></script>
<script src="js/scene6.js"></script>
</body>
</html>
