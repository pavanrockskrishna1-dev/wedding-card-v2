<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3D9DC">
<title></title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&amp;family=Great+Vibes&amp;family=Noto+Serif+Telugu:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage" class="stage">
  <div id="ambient" class="ambient" aria-hidden="true" hidden>
    <div class="ambient-light"></div>
    <svg class="ambient-leaves" viewBox="0 0 430 844" preserveAspectRatio="xMidYMid slice" focusable="false">
      <g fill="#6D1F3A">
        <path d="M452 110C363 171 291 239 245 358" fill="none" stroke="#6D1F3A" stroke-width="3"/>
        <path d="M379 169C333 119 304 144 336 196C303 178 270 196 303 231C281 211 249 231 276 263C261 253 229 281 260 302C240 313 219 340 245 358C270 335 286 306 267 294C306 294 324 266 288 252C330 253 350 223 318 211C365 219 390 204 354 184C393 190 416 163 379 169Z"/>
        <path d="M-25 615C47 565 92 482 117 417" fill="none" stroke="#6D1F3A" stroke-width="3"/>
        <path d="M22 577C-8 539 14 519 46 550C34 511 57 487 74 519C58 476 85 452 94 483C79 443 104 418 117 417C126 449 119 470 104 472C142 478 134 503 94 507C126 526 110 550 65 545C91 577 67 593 37 569Z"/>
      </g>
    </svg>
    <canvas id="ambient-canvas"></canvas>
  </div>

  <section class="scene" id="scene-1" data-scene="1" tabindex="-1" aria-hidden="true"></section>
  <section class="scene" id="scene-2" data-scene="2" tabindex="-1" aria-hidden="true"></section>
  <section class="scene" id="scene-3" data-scene="3" tabindex="-1" aria-hidden="true"></section>
  <section class="scene" id="scene-4" data-scene="4" tabindex="-1" aria-hidden="true"></section>
  <section class="scene" id="scene-5" data-scene="5" tabindex="-1" aria-hidden="true"></section>
  <section class="scene" id="scene-6" data-scene="6" tabindex="-1" aria-hidden="true"></section>

  <button id="sound-btn" class="sound-btn" type="button" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path class="ic-body" d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      <path class="ic-wave" d="M15.4 9.2a4 4 0 0 1 0 5.6M17.7 7a7 7 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <path class="ic-off" d="M15.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
  </button>
  <button id="next-btn" class="next-btn" type="button" hidden disabled>
    <span id="next-btn-label" class="next-btn-label"></span>
    <svg viewBox="0 0 18 10" width="18" height="10" aria-hidden="true">
      <path d="M1 1l8 8 8-8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script src="js/ambient.js"></script>
<script src="js/scene1.js"></script>
<script src="js/scene2.js"></script>
<script src="js/scene3.js"></script>
<script src="js/scene4.js"></script>
<script src="js/scene5.js"></script>
<script src="js/scene6.js"></script>
</body>
</html>
